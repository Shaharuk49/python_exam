<h1>URL Shortener</h1>
<form method="POST" style="margin-bottom: 20px; border: 1px solid #ccc; padding: 10px;" class="url-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Shorten</button>
</form>

{% if short_url %}
    <p>Your shortened URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
{% endif %}
</div>
